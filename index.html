<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RCH Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="links.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root{
        --bg-1: #071029;
        --bg-2: #0f1724;
        --accent: #6ee7ff;
        --accent-2: #7c3aed;
        --glass: rgba(255,255,255,0.04);
      }
      html,body{height:100%;}
      body {
        margin:0;
        background: radial-gradient(1200px 400px at 10% 10%, rgba(124,58,237,0.12), transparent), linear-gradient(180deg,var(--bg-1),var(--bg-2));
        color: #e6eef8;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        padding-bottom:48px;
      }
      .container{max-width:1100px}
      .header-bar {
        background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
        border-radius: 16px;
        padding: 1.25rem 1.5rem;
        margin: 24px 0 18px 0;
        display:flex;
        align-items:center;
        gap:1rem;
        box-shadow: 0 6px 30px rgba(2,6,23,0.5), inset 0 1px 0 rgba(255,255,255,0.02);
      }
      .brand-left{display:flex;align-items:center;gap:1rem}
      .header-bar img {
        height:56px;
        width:auto;
        border-radius:10px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        padding:6px;
        box-shadow: 0 4px 18px rgba(2,6,23,0.6);
      }
      .header-title{font-size:1.25rem;font-weight:700;color:linear-gradient(90deg,var(--accent),var(--accent-2));}
      .header-sub{color:rgba(230,238,248,0.75);font-size:0.95rem;margin-top:2px}
      .navbar{
        background:transparent !important;
        margin-bottom:1rem;
      }
      .navbar-nav .nav-link{color:rgba(230,238,248,0.8) !important;font-weight:600}
      .navbar-nav .nav-link.active, .navbar-nav .nav-link:hover{color:var(--accent) !important}
      .main-title{color:#e6eef8;font-size:1.25rem;font-weight:700;margin-bottom:0}

      /* search */
      .search-wrap{max-width:420px;width:100%}
      .search-input{
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border: none;
        color: #e6eef8;
        padding: 10px 14px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(2,6,23,0.6);
        outline: none;
      }
      .search-input::placeholder{color:rgba(230,238,248,0.5)}

      /* cards */
      .link-card{
        border-radius:14px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border:1px solid rgba(255,255,255,0.03);
        box-shadow: 0 8px 30px rgba(2,6,23,0.6);
        transition: transform .18s ease, box-shadow .18s ease;
      }
      .link-card:hover{transform:translateY(-6px);box-shadow:0 18px 60px rgba(0,0,0,0.6)}
      .link-card .card-body{display:flex;align-items:center;gap:1rem}
      .link-index{
        min-width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#04122b;background:linear-gradient(135deg,var(--accent),var(--accent-2));
        box-shadow:0 6px 20px rgba(124,58,237,0.12);
        font-size:1.05rem
      }
      .tx{font-size:1.05rem;font-weight:700;color:#eaf6ff}
      .sml-text{color:rgba(230,238,248,0.65);font-size:0.92rem}

      @media (max-width:600px){
        .header-bar{padding:12px;gap:0.5rem}
        .header-bar img{height:44px}
        .main-title{font-size:1rem}
      }
    </style>
</head>
  <body>
    <div class="container">
      <div class="header-bar">
        <div class="brand-left">
          <img src="images/bb.png" alt="Logo">
          <div>
            <div class="header-title">Alipurduar CMOH Office</div>
            <div class="header-sub">RCH Reporting • Monthly dashboards &amp; program summaries</div>
          </div>
        </div>
        <div class="ms-auto d-none d-md-flex" style="gap:12px;align-items:center">
          <img src="images/nhm.png" alt="NHM Logo" style="height:44px">
        </div>
      </div>
      <nav class="navbar navbar-expand-md px-3">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Monthly Report</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="https://docs.google.com/spreadsheets/d/1W23WvHSr1qCY6FLAPEk-RRlVYdugez2cn327vLo-YKE/edit?usp=sharing">IPHS</a>
              </li>
              <!-- <li class="nav-item">
                <a class="nav-link" href="ippi.html">IPPI 2024</a>
              </li> -->
              <!-- <li class="nav-item">
                <a class="nav-link" href="imi.html">IMI</a>
              </li> -->
              <li class="nav-item">
                <a class="nav-link" href="program.html">Program Report</a>
              </li>
               <li class="nav-item">
                <a class="nav-link" href="contacts.html">Contact</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="tree/infra.html">Infra</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <main x-data="{links: monthlyReportLinks, searchQuery: ''}">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <div class="main-title mb-0">Monthly Reports</div>
          <div class="search-wrap">
            <div class="input-group">
              <span class="input-group-text bg-transparent border-0" style="color:var(--accent);">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </span>
              <input type="text" class="search-input form-control" placeholder="Search reports..." x-model="searchQuery">
            </div>
          </div>
        </div>
        <template x-for="(link, index) in links.filter(l => !searchQuery || l.lbl.toLowerCase().includes(searchQuery.toLowerCase()) || (l.cap && l.cap.toLowerCase().includes(searchQuery.toLowerCase())))" :key="index">
          <a :href="link.link" target="_blank" style="text-decoration:none;">
            <div class="d-flex align-items-center mb-2">
              <div class="link-index" x-text="index+1"></div>
              <div class="card link-card flex-fill">
                <div class="card-body">
                  <p class="tx" x-text="link.lbl"></p>
                  <small class="sml-text" x-text="link.cap"></small>
                </div>
              </div>
            </div>
          </a>
        </template>
        <template x-if="links.filter(l => !searchQuery || l.lbl.toLowerCase().includes(searchQuery.toLowerCase()) || (l.cap && l.cap.toLowerCase().includes(searchQuery.toLowerCase()))).length === 0">
          <div class="text-center text-muted py-5">No reports found.</div>
        </template>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
